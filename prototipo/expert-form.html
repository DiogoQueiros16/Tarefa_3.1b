<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="img/animalec.ico">
  <title>ANIMALEC</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.6.3/css/all.min.css">
  <!-- Theme CSS (igual ao public/css/animalec.css do Animalec) -->
  <link href="css/animalec.css" rel="stylesheet">
  <link href="css/prototipo.css" rel="stylesheet">
  <script src="js/sweetalert2.all.min.js" defer></script>
  <script src="js/dados.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-pagina="expert-form">
  <a class="sr-only sr-only-focusable" href="#conteudo">Saltar para o conteúdo</a>
  <!-- App.vue -->
  <div class="container-fluid" id="app">
    <!-- NavBar.vue -->
    <header>
      <nav class="navbar navbar-dark bg-dark navbar-expand-lg" aria-label="Navegação principal">
        <a href="index.html" class="navbar-brand ml-5"><img src="img/animalec_line.png" alt="Animalec" title="Página principal do Animalec" style="width: 250px; height: 50px;"></a>
        <button type="button" aria-label="Toggle navigation" aria-controls="nav-collapse" aria-expanded="false" class="navbar-toggler"><span class="navbar-toggler-icon"></span></button>
        <div id="nav-collapse" class="navbar-collapse collapse">
          <ul class="navbar-nav ml-auto mr-5">
            <li class="nav-item"><a href="#" class="nav-link" data-fora="Animais (área do utilizador)">ANIMAIS</a></li>
            <li class="nav-item"><a href="#" class="nav-link" data-fora="Quizzes (área do utilizador)">QUIZZES</a></li>
            <li class="nav-item"><a href="index.html#contacts" class="nav-link">CONTACTOS</a></li>
            <li class="nav-item" id="nav-admin" hidden><a href="admin.html" class="nav-link">ADMIN</a></li>
            <li class="nav-item" id="nav-login"><a href="login.html" class="nav-link">LOGIN</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main id="conteudo">
      <section class="page-section">
        <div class="container">
          <!-- HeaderPage.vue -->
          <header class="container">
            <div class="row text-center"><div class="col"><h1 class="page-section-heading mt-5" id="titulo-form">ADICIONAR ESPECIALISTA</h1></div></div>
            <div class="row text-center"><div class="col">
              <div class="divider-custom" aria-hidden="true"><div class="divider-custom-line"></div><div class="divider-custom-icon"><i class="fas fa-star"></i></div><div class="divider-custom-line"></div></div>
            </div></div>
          </header>
          <!--FORM-->
          <div class="row">
            <div class="col-2"></div>
            <div class="col-8">
              <form id="formulario" data-entidade="experts" data-lista="experts.html" data-nome="Especialista">
                <div class="form-group">
                  <label for="name" class="sr-only">Nome</label>
                  <input type="text" id="name" name="name" class="form-control form-control-lg" placeholder="escreve nome" maxlength="80" required>
                </div>
                <div class="form-group">
                  <label for="specialty" class="sr-only">Especialidade</label>
                  <select id="specialty" name="specialty" class="form-control form-control-lg" required>
                    <option value="">-- SELECIONA ESPECIALIDADE --</option>
                    <option value="anfibio">ANFÍBIO</option>
                    <option value="ave">AVE</option>
                    <option value="mamifero">MAMÍFERO</option>
                    <option value="peixe">PEIXE</option>
                    <option value="reptil">RÉPTIL</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="institution" class="sr-only">Instituição</label>
                  <input type="text" id="institution" name="institution" class="form-control form-control-lg" placeholder="escreve instituição" list="instituicoes" required>
                </div>
                <datalist id="instituicoes"><option value="Instituto de Zoologia do Norte"><option value="Centro de Estudos de Aves"><option value="Universidade do Litoral"></datalist>
                <div class="form-group">
                  <label for="description" class="sr-only">Biografia</label>
                  <textarea id="description" name="description" class="form-control form-control-lg" placeholder="escreve biografia" cols="30" rows="5" maxlength="400"></textarea>
                </div>
                <div class="form-group">
                  <label for="email" class="sr-only">Email</label>
                  <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="escreve email" required>
                </div>
                <div class="form-group">
                  <label for="photo" class="sr-only">Link para a foto</label>
                  <input type="url" id="photo" name="photo" class="form-control form-control-lg" placeholder="escreve link para foto" >
                </div>
                <div class="form-group">
                  <label for="website" class="sr-only">Link para a página pessoal</label>
                  <input type="url" id="website" name="website" class="form-control form-control-lg" placeholder="escreve link para página pessoal" >
                </div>
                <!-- relação N:N com Animal: mesmo padrão da lista de questões de AddQuiz.vue -->
                <fieldset>
                  <legend class="sr-only">Animais associados</legend>
                  <div id="cabecalho-animais" hidden>
                    <div class="row">
                      <div class="col-md-9"><h4>Lista de animais</h4></div>
                      <div class="col-md-3"><h4>Ações</h4></div>
                    </div>
                  </div>
                  <div id="animais"></div>
                </fieldset>
                <button type="button" class="btn btn-outline-success mr-2" id="adicionar-animal"><i class="fas fa-plus-square"></i> ADICIONAR ANIMAIS</button>
                <button type="submit" class="btn btn-outline-success mr-2" id="submeter"><i class="fas fa-save"></i> GRAVAR ESPECIALISTA</button>
                <a href="experts.html" class="btn btn-outline-danger"><i class="fas fa-window-close"></i> CANCELAR</a>
              </form>
            </div>
            <div class="col-2"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
